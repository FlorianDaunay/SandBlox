<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
    }

    /* Welcome Screen Overlay */
    #welcome-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 15, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .login-container {
      background: #1a1a1a;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      text-align: center;
      max-width: 350px;
      width: 90%;
    }

    h1 {
      color: #fff;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 20px;
      margin-bottom: 1.25rem;
      box-sizing: border-box;
      border: 2px solid #444;
      border-radius: 6px;
      background-color: #222;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    /* Custom Color Picker Styling */
    .color-section,
    .weapon-section {
      background-color: #222;
      border: 2px solid #444;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .section-title {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 10px;
      display: block;
    }

    .color-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    #color-preview {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      border: 1px solid #555;
      background-color: #ff0000;
      flex-shrink: 0;
    }

    #color-hex-input {
      margin-bottom: 0;
      font-family: monospace;
      text-transform: uppercase;
    }

    .rainbow-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 6px;
      outline: none;
      background: linear-gradient(to right,
          #ff0000 0%, #ffff00 17%, #00ff00 33%,
          #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
    }

    .rainbow-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #000;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .rainbow-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #000;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    /* Weapon Selector Square Buttons Styling */
    .weapon-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 5px;
    }

    .weapon-btn {
      aspect-ratio: 1 / 1;
      width: 100%;
      padding: 0;
      background-color: #333;
      border: 2px solid #555;
      border-radius: 6px;
      color: #fff;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .weapon-btn:hover {
      background-color: #444;
      border-color: #888;
    }

    .weapon-btn.selected {
      background-color: #007bff;
      border-color: #fff;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.6);
      transform: scale(1.05);
    }

    #start-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, opacity 0.3s;
    }

    #start-btn:hover:not(:disabled) {
      background-color: #0056b3;
    }

    #start-btn:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div id="welcome-screen">
    <div class="login-container">
      <h1>Sandbox</h1>
      <input type="text" id="player-name" placeholder="Enter your name..." autocomplete="off" maxlength="12" />
      <div id="name-error"
        style="color: #ff4d4d; font-size: 0.85rem; text-align: left; margin-top: -10px; margin-bottom: 15px; display: none;">
        Name cannot be empty
      </div>

      <div class="color-section">
        <span class="section-title">Choose your Color</span>
        <div class="color-row">
          <div id="color-preview"></div>
          <input type="text" id="color-hex-input" value="0xFF0000" maxlength="8" autocomplete="off" />
        </div>
        <div id="hex-error"
          style="color: #ff4d4d; font-size: 0.85rem; text-align: left; margin-top: -5px; display: none;">
          Invalid hex format (use 0xRRGGBB)
        </div>
        <input type="range" id="rainbow-slider" class="rainbow-slider" min="0" max="360" value="0" />
      </div>

      <div class="weapon-section">
        <span class="section-title">Select Starting Weapon</span>
        <div class="weapon-grid">
          <button type="button" class="weapon-btn selected" data-weapon="sword" title="Sword">⚔️</button>
          <button type="button" class="weapon-btn" data-weapon="lance" title="Lance">🔱</button>
          <button type="button" class="weapon-btn" data-weapon="bow" title="Bow">🏹</button>
          <button type="button" class="weapon-btn" data-weapon="firestaff" title="Fire Staff">🔥</button>
          <button type="button" class="weapon-btn" data-weapon="random" title="Random Weapon">?</button>
        </div>
      </div>

      <button id="start-btn" disabled>Start Game</button>
    </div>
  </div>

  <script type="module" src="/frontend/main.ts"></script>
</body>

</html>
