<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
    }

    /* Welcome Screen Overlay */
    #welcome-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 15, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .login-container {
      background: #1a1a1a;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      text-align: center;
      max-width: 350px;
      width: 90%;
    }

    h1 {
      color: #fff;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 20px;
      margin-bottom: 1.25rem;
      box-sizing: border-box;
      border: 2px solid #444;
      border-radius: 6px;
      background-color: #222;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, opacity 0.3s;
    }

    button:hover:not(:disabled) {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <!-- Login Overlay -->
  <div id="welcome-screen">
    <div class="login-container">
      <h1>Voxel Sandbox</h1>
      <input type="text" id="player-name" placeholder="Enter your name..." autocomplete="off" max="15" />
      <button id="start-btn" disabled>Start Game</button>
    </div>
  </div>

  <script type="module" src="/frontend/main.ts"></script>
</body>

</html>
